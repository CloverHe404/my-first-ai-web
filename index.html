<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A small hello</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172554;
      background: #f1f5f9;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 520px);
      padding: 40px;
      border: 1px solid #dbeafe;
      border-radius: 20px;
      background: white;
      box-shadow: 0 18px 50px rgb(23 37 84 / 10%);
      text-align: center;
    }

    h1 { margin: 0 0 12px; font-size: clamp(2rem, 7vw, 3rem); }
    p { color: #475569; line-height: 1.6; }

    button {
      margin-top: 16px;
      padding: 12px 20px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    button:hover { background: #1d4ed8; }
    button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; }
    #message { min-height: 1.6em; margin-bottom: 0; color: #1d4ed8; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>A small hello</h1>
    <p>This page is made with plain HTML, CSS, and JavaScript.</p>
    <button id="hello-button" type="button">Say hello</button>
    <p id="message" aria-live="polite">Your message will appear here.</p>
  </main>
  <script>
    const button = document.querySelector("#hello-button");
    const message = document.querySelector("#message");

    button.addEventListener("click", () => {
      message.textContent = "Hello! Thanks for stopping by.";
    });
  </script>
</body>
</html>
